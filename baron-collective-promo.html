<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baron Collective · Amsterdam · 19 Juli</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --mint: #00FFB3;
      --mint-glow: rgba(0, 255, 179, 0.55);
      --mint-dim: rgba(0, 255, 179, 0.08);
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      -webkit-font-smoothing: antialiased;
    }

    /* ---- Canvas layers ---- */
    #bg    { position: fixed; inset: 0; z-index: 0; }
    #grain { position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: 0.42; mix-blend-mode: screen; }

    /* ---- Scanlines ---- */
    #scanlines {
      position: fixed; inset: 0; z-index: 3; pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 2px,
        rgba(0,0,0,0.10) 2px, rgba(0,0,0,0.10) 4px
      );
    }

    /* ---- Vignette ---- */
    #vignette {
      position: fixed; inset: 0; z-index: 3; pointer-events: none;
      background: radial-gradient(ellipse at center,
        transparent 38%, rgba(0,0,0,0.55) 75%, rgba(0,0,0,0.92) 100%
      );
    }

    /* ---- Flash overlays ---- */
    #flash, #mint-flash {
      position: fixed; inset: 0; z-index: 9;
      pointer-events: none;
      opacity: 0;
      will-change: opacity;
      transition: opacity 0.04s linear;
    }
    #flash      { background: #fff; }
    #mint-flash { background: var(--mint); }

    /* ---- Stage ---- */
    #stage {
      position: fixed; inset: 0; z-index: 5;
      display: flex; align-items: center; justify-content: center;
    }

    .phase {
      position: absolute;
      width: 100%;
      text-align: center;
      padding: 0 6%;
      opacity: 0;
      will-change: opacity, transform;
    }

    /* ===== PHASE 1  0–4s ===== */
    #p1 { top: 50%; transform: translateY(-50%); }

    .p1-tag {
      font-family: 'IBM Plex Mono', monospace;
      font-size: clamp(10px, 1.7vw, 15px);
      letter-spacing: 0.52em;
      color: rgba(255,255,255,0.38);
      text-transform: uppercase;
      margin-bottom: 6px;
      display: block;
    }

    .p1-baron {
      font-family: 'Bebas Neue', Impact, sans-serif;
      font-size: clamp(80px, 20vw, 240px);
      line-height: 0.86;
      color: var(--mint);
      text-shadow:
        0 0 60px var(--mint-glow),
        0 0 130px rgba(0,255,179,0.28),
        0 0 240px rgba(0,255,179,0.12);
      letter-spacing: 0.03em;
      display: block;
      position: relative;
    }

    .p1-collective {
      font-family: 'Bebas Neue', Impact, sans-serif;
      font-size: clamp(22px, 5.5vw, 68px);
      line-height: 1;
      color: rgba(255,255,255,0.68);
      letter-spacing: 0.38em;
      display: block;
    }

    /* ===== PHASE 2  4–8s ===== */
    #p2 { top: 50%; transform: translateY(-50%); }

    .artist {
      font-family: 'Bebas Neue', Impact, sans-serif;
      font-size: clamp(52px, 13vw, 160px);
      line-height: 0.88;
      letter-spacing: 0.05em;
      color: #fff;
      opacity: 0;
      display: block;
      will-change: opacity;
    }
    .artist.hl {
      color: var(--mint);
      text-shadow: 0 0 40px var(--mint-glow), 0 0 80px rgba(0,255,179,0.2);
    }

    .sep {
      font-family: 'IBM Plex Mono', monospace;
      font-size: clamp(9px, 1.4vw, 12px);
      letter-spacing: 0.65em;
      color: var(--mint);
      opacity: 0;
      display: block;
      margin: 5px 0;
      will-change: opacity;
    }

    /* ===== PHASE 3  8–12s ===== */
    #p3 { top: 50%; transform: translateY(-50%); }

    .p3-date {
      font-family: 'Bebas Neue', Impact, sans-serif;
      font-size: clamp(88px, 24vw, 300px);
      line-height: 0.84;
      color: var(--mint);
      text-shadow:
        0 0 80px var(--mint-glow),
        0 0 160px rgba(0,255,179,0.22),
        0 0 300px rgba(0,255,179,0.10);
      letter-spacing: 0;
      display: block;
    }

    .p3-time {
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 700;
      font-size: clamp(16px, 4.2vw, 52px);
      letter-spacing: 0.22em;
      color: rgba(255,255,255,0.88);
      display: block;
      margin-top: 6px;
    }

    .p3-loc {
      font-family: 'IBM Plex Mono', monospace;
      font-size: clamp(9px, 1.5vw, 13px);
      letter-spacing: 0.55em;
      color: rgba(255,255,255,0.26);
      display: block;
      margin-top: 16px;
    }

    /* ===== PHASE 4  12–15s ===== */
    #p4 { top: 50%; transform: translateY(-50%); }

    .p4-tickets {
      font-family: 'Bebas Neue', Impact, sans-serif;
      font-size: clamp(52px, 13vw, 160px);
      line-height: 0.88;
      letter-spacing: 0.09em;
      color: #fff;
      display: block;
    }

    .p4-bio {
      font-family: 'Bebas Neue', Impact, sans-serif;
      font-size: clamp(52px, 13vw, 160px);
      line-height: 0.88;
      letter-spacing: 0.09em;
      color: var(--mint);
      text-shadow: 0 0 50px var(--mint-glow), 0 0 100px rgba(0,255,179,0.18);
      display: block;
    }

    .p4-sub {
      font-family: 'IBM Plex Mono', monospace;
      font-size: clamp(9px, 1.5vw, 13px);
      letter-spacing: 0.55em;
      color: rgba(255,255,255,0.26);
      display: block;
      margin-top: 20px;
    }

    /* ---- Controls ---- */
    #controls {
      position: fixed; bottom: 28px; left: 0; right: 0;
      z-index: 10;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }

    #progress-bar {
      width: min(420px, 78vw); height: 1px;
      background: rgba(255,255,255,0.10);
    }
    #progress-fill {
      height: 100%; width: 0%;
      background: var(--mint);
      box-shadow: 0 0 10px rgba(0,255,179,0.9);
    }

    #play-btn {
      background: transparent;
      border: 1px solid var(--mint);
      color: var(--mint);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.42em;
      padding: 11px 34px;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.12s, color 0.12s;
      display: block;
    }
    #play-btn:hover  { background: var(--mint); color: #000; }
    #play-btn:active { transform: scale(0.97); }

    /* ---- glitch keyframe (applied via JS) ---- */
    @keyframes glitch-jolt {
      0%        { transform: translateY(-50%) translate(0, 0);    }
      12%       { transform: translateY(-50%) translate(-4px, 1px); }
      25%       { transform: translateY(-50%) translate(4px, -2px);  }
      37%       { transform: translateY(-50%) translate(-2px, 2px);  }
      50%       { transform: translateY(-50%) translate(3px, -1px);  }
      62%       { transform: translateY(-50%) translate(-1px, 1px);  }
      75%, 100% { transform: translateY(-50%) translate(0, 0);    }
    }
    .jolt { animation: glitch-jolt 0.18s steps(1) 1 forwards; }
  </style>
</head>
<body>

<canvas id="bg"></canvas>
<canvas id="grain"></canvas>
<div id="scanlines"></div>
<div id="vignette"></div>
<div id="mint-flash"></div>
<div id="flash"></div>

<div id="stage">
  <!-- Phase 1 -->
  <div class="phase" id="p1">
    <span class="p1-tag">Amsterdam · Baron Collective</span>
    <span class="p1-baron">BARON</span>
    <span class="p1-collective">COLLECTIVE</span>
  </div>

  <!-- Phase 2 -->
  <div class="phase" id="p2">
    <span class="artist" id="a1">JULIAR</span>
    <span class="sep"    id="s1">— — —</span>
    <span class="artist" id="a2">LIKE61</span>
    <span class="sep"    id="s2">— — —</span>
    <span class="artist hl" id="a3">SECRET GUEST</span>
  </div>

  <!-- Phase 3 -->
  <div class="phase" id="p3">
    <span class="p3-date">19 JULI</span>
    <span class="p3-time">14:00 — 19:00</span>
    <span class="p3-loc">Amsterdam · Baron Collective</span>
  </div>

  <!-- Phase 4 -->
  <div class="phase" id="p4">
    <span class="p4-tickets">TICKETS</span>
    <span class="p4-bio">IN BIO</span>
    <span class="p4-sub">Baron Collective · 19 Juli · Amsterdam</span>
  </div>
</div>

<div id="controls">
  <div id="progress-bar"><div id="progress-fill"></div></div>
  <button id="play-btn" onclick="startPromo()">▶&nbsp; PLAY PROMO</button>
</div>

<script>
// ============================================================
//  CONFIG
// ============================================================
const TOTAL_MS = 15000;
const PHASES = [
  { id: 'p1', start: 0,     end: 4000  },
  { id: 'p2', start: 4000,  end: 8000  },
  { id: 'p3', start: 8000,  end: 12000 },
  { id: 'p4', start: 12000, end: 15000 },
];
const ARTIST_BEATS = [
  { id: 'a1', t: 120  },
  { id: 's1', t: 820  },
  { id: 'a2', t: 1500 },
  { id: 's2', t: 2200 },
  { id: 'a3', t: 2900 },
];

// ============================================================
//  CANVAS
// ============================================================
const bgCanvas    = document.getElementById('bg');
const bgCtx       = bgCanvas.getContext('2d');
const grainCanvas = document.getElementById('grain');
const grainCtx    = grainCanvas.getContext('2d');

function resize() {
  bgCanvas.width  = grainCanvas.width  = window.innerWidth;
  bgCanvas.height = grainCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ============================================================
//  FILM GRAIN (continuous)
// ============================================================
(function grainLoop() {
  const w = grainCanvas.width, h = grainCanvas.height;
  const img = grainCtx.createImageData(w, h);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = (Math.random() * 210) | 0;
    d[i] = d[i+1] = d[i+2] = v;
    d[i+3] = 36;
  }
  grainCtx.putImageData(img, 0, 0);
  requestAnimationFrame(grainLoop);
})();

// ============================================================
//  BACKGROUND RENDERER
// ============================================================
function renderBg(t, phase) {
  const w = bgCanvas.width, h = bgCanvas.height;
  bgCtx.clearRect(0, 0, w, h);
  bgCtx.fillStyle = '#000';
  bgCtx.fillRect(0, 0, w, h);

  if (phase === 0) bgP1(t, w, h);
  else if (phase === 1) bgP2(t, w, h);
  else if (phase === 2) bgP3(t, w, h);
  // phase 3 → pure black, already done
}

function bgP1(t, w, h) {
  // Dark concrete with slow mint scan lines
  const grd = bgCtx.createLinearGradient(0, 0, 0, h);
  grd.addColorStop(0, '#070707');
  grd.addColorStop(0.5, '#020202');
  grd.addColorStop(1, '#090909');
  bgCtx.fillStyle = grd;
  bgCtx.fillRect(0, 0, w, h);

  for (let i = 0; i < 3; i++) {
    const y = ((t * 0.032 + i * (h / 3)) % h + h) % h;
    const g = bgCtx.createLinearGradient(0, y - 80, 0, y + 80);
    g.addColorStop(0, 'transparent');
    g.addColorStop(0.5, 'rgba(0,255,179,0.018)');
    g.addColorStop(1, 'transparent');
    bgCtx.fillStyle = g;
    bgCtx.fillRect(0, y - 80, w, 160);
  }

  // Occasional horizontal glitch bar
  if (Math.random() < 0.035) {
    const gy = Math.random() * h;
    bgCtx.fillStyle = 'rgba(0,255,179,0.04)';
    bgCtx.fillRect(0, gy, w * (0.25 + Math.random() * 0.75), Math.random() * 6 + 1);
  }
}

function bgP2(t, w, h) {
  // Faster lines, strobey glitch bars
  for (let i = 0; i < 7; i++) {
    const dir = i % 2 === 0 ? 1 : -1;
    const y = ((t * 0.075 * dir + i * (h / 7)) % h + h) % h;
    const a = 0.012 + Math.sin(t * 0.008 + i * 1.7) * 0.008;
    bgCtx.fillStyle = `rgba(0,255,179,${Math.max(0, a)})`;
    bgCtx.fillRect(0, y, w, 1);
  }

  if (Math.random() < 0.10) {
    const gy = Math.random() * h;
    const gw = w * (0.15 + Math.random() * 0.55);
    bgCtx.fillStyle = 'rgba(0,255,179,0.055)';
    bgCtx.fillRect(Math.random() * (w - gw), gy, gw, Math.random() * 14 + 1);
  }
}

function bgP3(t, w, h) {
  // Radial pulse + whip-pan streaks
  const rel   = t - 8000;
  const pulse = Math.abs(Math.sin(rel * 0.018));
  const rg    = bgCtx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, Math.max(w, h) * 0.52);
  rg.addColorStop(0, `rgba(0,255,179,${pulse * 0.13})`);
  rg.addColorStop(0.45, `rgba(0,255,179,${pulse * 0.04})`);
  rg.addColorStop(1, 'transparent');
  bgCtx.fillStyle = rg;
  bgCtx.fillRect(0, 0, w, h);

  // Vertical streaks simulating whip pan
  for (let i = 0; i < 5; i++) {
    const dir = i % 2 === 0 ? 1 : -0.7;
    const x   = ((rel * 0.22 * dir + i * w * 0.2) % w + w) % w;
    const sw  = w * 0.12;
    const sg  = bgCtx.createLinearGradient(x, 0, x + sw, 0);
    sg.addColorStop(0, 'transparent');
    sg.addColorStop(0.5, 'rgba(255,255,255,0.022)');
    sg.addColorStop(1, 'transparent');
    bgCtx.fillStyle = sg;
    bgCtx.fillRect(x, 0, sw, h);
  }

  // Heavy glitch bars in phase 3
  if (Math.random() < 0.18) {
    const gy = Math.random() * h;
    bgCtx.fillStyle = `rgba(0,255,179,${0.05 + Math.random() * 0.06})`;
    bgCtx.fillRect(0, gy, w, Math.random() * 18 + 2);
  }
}

// ============================================================
//  FLASH / STROBE
// ============================================================
const flashEl     = document.getElementById('flash');
const mintFlashEl = document.getElementById('mint-flash');

function flash(color, opacityVal, ms) {
  const el = color === 'mint' ? mintFlashEl : flashEl;
  el.style.transition = 'none';
  el.style.opacity = opacityVal;
  setTimeout(() => { el.style.transition = 'opacity 0.06s linear'; el.style.opacity = 0; }, ms);
}

// ============================================================
//  ARTIST REVEAL (phase 2)
// ============================================================
function updateArtists(phaseT) {
  ARTIST_BEATS.forEach(({ id, t }) => {
    document.getElementById(id).style.opacity = phaseT >= t ? '1' : '0';
  });
}

// ============================================================
//  TEXT GLITCH JOLT (phase 1)
// ============================================================
let lastJolt = 0;
function maybeJolt(elapsed) {
  if (elapsed - lastJolt > 350 + Math.random() * 900) {
    const el = document.getElementById('p1');
    el.classList.remove('jolt');
    void el.offsetWidth;          // reflow to restart animation
    el.classList.add('jolt');
    lastJolt = elapsed;
  }
}

// ============================================================
//  PHASE MANAGEMENT
// ============================================================
let activePh = -1;

function showPhase(idx) {
  if (idx === activePh) return;

  PHASES.forEach(p => { document.getElementById(p.id).style.opacity = '0'; });
  ['a1','s1','a2','s2','a3'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.opacity = '0';
  });

  if (idx >= 0 && idx < PHASES.length) {
    document.getElementById(PHASES[idx].id).style.opacity = '1';
    if (activePh >= 0) flash('white', 0.75, 55);   // hard-cut flash
  }

  activePh = idx;
}

// ============================================================
//  MAIN LOOP
// ============================================================
let t0 = null, rafId = null;

function loop(now) {
  if (!t0) t0 = now;
  const elapsed = now - t0;

  // Progress
  document.getElementById('progress-fill').style.width =
    Math.min((elapsed / TOTAL_MS) * 100, 100) + '%';

  // Phase index
  let phase = -1;
  for (let i = 0; i < PHASES.length; i++) {
    if (elapsed >= PHASES[i].start && elapsed < PHASES[i].end) { phase = i; break; }
  }
  if (elapsed >= TOTAL_MS) phase = PHASES.length - 1;   // freeze on last frame

  showPhase(phase);
  renderBg(elapsed, phase);

  // Phase-specific behaviours
  if (phase === 0) {
    maybeJolt(elapsed);
    if (Math.random() < 0.006) flash('white', 0.18, 28);
  }
  if (phase === 1) {
    updateArtists(elapsed - PHASES[1].start);
    if (Math.random() < 0.005) flash('white', 0.30, 32);
  }
  if (phase === 2) {
    if (Math.random() < 0.013) flash('mint',  0.14, 28);
    if (Math.random() < 0.007) flash('white', 0.45, 40);
  }

  if (elapsed < TOTAL_MS) {
    rafId = requestAnimationFrame(loop);
  } else {
    // Done — show replay
    const btn = document.getElementById('play-btn');
    btn.textContent = '↺  REPLAY';
    btn.style.display = 'block';
  }
}

// ============================================================
//  START
// ============================================================
function startPromo() {
  if (rafId) cancelAnimationFrame(rafId);
  t0     = null;
  activePh = -1;
  lastJolt = 0;

  PHASES.forEach(p => { document.getElementById(p.id).style.opacity = '0'; });
  ['a1','s1','a2','s2','a3'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.opacity = '0';
  });

  document.getElementById('progress-fill').style.width = '0%';
  document.getElementById('play-btn').style.display = 'none';

  // Black-screen intro (very first frame) then start
  bgCtx.fillStyle = '#000';
  bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

  rafId = requestAnimationFrame(loop);
}
</script>
</body>
</html>
