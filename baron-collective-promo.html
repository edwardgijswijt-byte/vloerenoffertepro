<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baron Collective · 19 Juli · Amsterdam</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; min-height: 100vh;
      background: #0e0e0e;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      overflow: hidden;
    }
    #wrap {
      position: relative;
      /* 9:16 aspect ratio, fits the screen */
      height: min(85vh, calc(50vw * 16 / 9));
      width:  min(calc(85vh * 9 / 16), 50vw);
      min-width: 220px;
      background: #000;
      box-shadow: 0 0 60px rgba(0,255,179,0.12);
    }
    canvas { width: 100%; height: 100%; display: block; }
    #pbar-wrap {
      width: min(calc(85vh * 9 / 16), 50vw);
      min-width: 220px;
      height: 1px; background: rgba(255,255,255,0.10);
    }
    #pbar { height: 100%; width: 0%; background: #00FFB3;
            box-shadow: 0 0 8px rgba(0,255,179,0.9); }
    #btns { display: flex; gap: 10px; align-items: center; }
    button {
      background: transparent;
      border: 1px solid #00FFB3; color: #00FFB3;
      font-family: 'Courier New', monospace;
      font-size: 11px; letter-spacing: 0.35em; text-transform: uppercase;
      padding: 9px 24px; cursor: pointer;
      transition: background 0.12s, color 0.12s;
    }
    button:hover:not(:disabled) { background: #00FFB3; color: #000; }
    button:disabled { opacity: 0.30; cursor: default; }
    #rec-btn { border-color: rgba(255,255,255,0.55); color: rgba(255,255,255,0.55); }
    #rec-btn:hover:not(:disabled) { background: rgba(255,255,255,0.9); color: #000; }
    #rec-btn.recording { border-color: #ff3a3a; color: #ff3a3a; }
    #status {
      font-family: 'Courier New', monospace; font-size: 10px;
      letter-spacing: 0.32em; color: rgba(255,255,255,0.30);
      text-transform: uppercase; min-height: 16px; text-align: center;
    }
  </style>
</head>
<body>

<div id="wrap"><canvas id="c"></canvas></div>
<div id="pbar-wrap"><div id="pbar"></div></div>
<div id="btns">
  <button id="play-btn" onclick="startPromo()">&#9654;&nbsp; Play</button>
  <button id="rec-btn"  onclick="startRecord()">&#9210;&nbsp; Download video</button>
</div>
<div id="status">Open bestand lokaal in browser · klik Play</div>

<script>
// ─────────────────────────────────────────────
//  CANVAS  (1080 × 1920 = Instagram 9:16)
// ─────────────────────────────────────────────
const CW = 1080, CH = 1920, CX = 540, CY = 960;
const MINT  = '#00FFB3';
const ma    = a => `rgba(0,255,179,${a})`;
const wa    = a => `rgba(255,255,255,${a})`;

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
canvas.width  = CW;
canvas.height = CH;

// Small grain buffer – drawn scaled-up each frame (2× smaller = 4× faster)
const gC  = document.createElement('canvas');
gC.width  = 270; gC.height = 480;
const gCtx = gC.getContext('2d');
const gImg = gCtx.createImageData(270, 480);   // reuse to avoid GC pressure

// ─────────────────────────────────────────────
//  TIMING
// ─────────────────────────────────────────────
const TOTAL = 15000;
const P = [
  { s: 0,     e: 4000  },   // 0  BARON COLLECTIVE
  { s: 4000,  e: 8000  },   // 1  Artists
  { s: 8000,  e: 12000 },   // 2  Date / Time
  { s: 12000, e: 15000 },   // 3  Tickets in Bio
];

// Artists – relative ms from start of phase 1
const ACTS = [
  { name: 'JULIAR',       y: 780,  size: 158, hl: false, t: 120  },
  { sep: true,            y: 838,  size: 22,            t: 820  },
  { name: 'LIKE61',       y: 998,  size: 158, hl: false, t: 1480 },
  { sep: true,            y: 1056, size: 22,            t: 2130 },
  { name: 'SECRET GUEST', y: 1216, size: 120, hl: true,  t: 2780 },
];

// ─────────────────────────────────────────────
//  FILM GRAIN
// ─────────────────────────────────────────────
function grain() {
  const px = gImg.data;
  for (let i = 0; i < px.length; i += 4) {
    const v = (Math.random() * 215) | 0;
    px[i] = px[i+1] = px[i+2] = v; px[i+3] = 38;
  }
  gCtx.putImageData(gImg, 0, 0);
  ctx.save();
  ctx.globalAlpha = 0.40;
  ctx.globalCompositeOperation = 'screen';
  ctx.drawImage(gC, 0, 0, CW, CH);
  ctx.restore();
}

// ─────────────────────────────────────────────
//  TEXT HELPERS
// ─────────────────────────────────────────────
const DISP = "Impact,'Arial Black','Arial Narrow Bold',Arial,sans-serif";
const MONO = "'Courier New','Lucida Console',monospace";

function t(str, y, size, color, font = DISP) {
  ctx.font = `${size}px ${font}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = color;
  // Auto-shrink if text overflows
  while (ctx.measureText(str).width > CW - 80 && size > 18) {
    size -= 4; ctx.font = `${size}px ${font}`;
  }
  ctx.fillText(str, CX, y);
}

function glow(color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; }
function noGlow()           { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; }

// ─────────────────────────────────────────────
//  BACKGROUNDS
// ─────────────────────────────────────────────
function bg(elapsed, phase) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, CW, CH);
  if (phase === 0) bg0(elapsed);
  else if (phase === 1) bg1(elapsed);
  else if (phase === 2) bg2(elapsed);
}

function bg0(ms) {
  for (let i = 0; i < 3; i++) {
    const y = ((ms * 0.05 + i * (CH / 3)) % CH + CH) % CH;
    const g = ctx.createLinearGradient(0, y-120, 0, y+120);
    g.addColorStop(0, 'transparent'); g.addColorStop(0.5, ma(0.025)); g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.fillRect(0, y-120, CW, 240);
  }
  // Thin vertical edge accent lines
  ctx.strokeStyle = ma(0.06); ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(80, 0); ctx.lineTo(80, CH);
  ctx.moveTo(CW-80, 0); ctx.lineTo(CW-80, CH);
  ctx.stroke();
  // Random glitch bar
  if (Math.random() < 0.04) {
    ctx.fillStyle = ma(0.055);
    ctx.fillRect(0, Math.random()*CH, CW*(0.3+Math.random()*0.7), Math.random()*8+1);
  }
}

function bg1(ms) {
  for (let i = 0; i < 8; i++) {
    const dir = i % 2 ? -1 : 1;
    const y   = ((ms * 0.10 * dir + i*(CH/8)) % CH + CH) % CH;
    const a   = Math.max(0, 0.018 + Math.sin(ms*0.006+i*1.7)*0.010);
    ctx.fillStyle = ma(a); ctx.fillRect(0, y, CW, 1);
  }
  if (Math.random() < 0.12) {
    const gw = CW * (0.15 + Math.random()*0.55);
    ctx.fillStyle = ma(0.065);
    ctx.fillRect(Math.random()*(CW-gw), Math.random()*CH, gw, Math.random()*18+1);
  }
}

function bg2(ms) {
  const rel   = ms - 8000;
  const pulse = Math.abs(Math.sin(rel * 0.018));
  const rg = ctx.createRadialGradient(CX,CY,0, CX,CY, Math.max(CW,CH)*0.55);
  rg.addColorStop(0,    ma(pulse*0.14));
  rg.addColorStop(0.45, ma(pulse*0.04));
  rg.addColorStop(1,    'transparent');
  ctx.fillStyle = rg; ctx.fillRect(0, 0, CW, CH);
  for (let i = 0; i < 5; i++) {
    const dir = i%2 ? -0.6 : 1;
    const x   = ((rel*0.32*dir + i*CW*0.2) % CW + CW) % CW;
    const sw  = CW * 0.13;
    const sg  = ctx.createLinearGradient(x,0, x+sw,0);
    sg.addColorStop(0,'transparent'); sg.addColorStop(0.5,wa(0.028)); sg.addColorStop(1,'transparent');
    ctx.fillStyle = sg; ctx.fillRect(x, 0, sw, CH);
  }
  if (Math.random() < 0.20) {
    ctx.fillStyle = ma(0.05 + Math.random()*0.06);
    ctx.fillRect(0, Math.random()*CH, CW, Math.random()*24+2);
  }
}

// ─────────────────────────────────────────────
//  PHASE RENDERERS
// ─────────────────────────────────────────────
let isGlitch = false;

function renderP0() {
  // City / event tag
  t('AMSTERDAM  ·  BARON COLLECTIVE', CY-360, 26, wa(0.35), MONO);

  // BARON – large mint
  glow(MINT, 90);
  t('BARON', CY - 65, 295, MINT);

  if (isGlitch) {
    // Cyan slice above midpoint
    ctx.save();
    ctx.beginPath(); ctx.rect(0, CY-295, CW, 115); ctx.clip();
    ctx.globalAlpha = 0.50;
    ctx.font = `295px ${DISP}`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = 'rgba(0,255,255,1)';
    ctx.fillText('BARON', CX-5, CY-65);
    ctx.restore();
    // White slice below
    ctx.save();
    ctx.beginPath(); ctx.rect(0, CY-90, CW, 55); ctx.clip();
    ctx.globalAlpha = 0.40;
    ctx.font = `295px ${DISP}`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#fff';
    ctx.fillText('BARON', CX+5, CY-65);
    ctx.restore();
  }
  noGlow();

  // COLLECTIVE – smaller, muted white
  t('COLLECTIVE', CY + 90, 82, wa(0.62));

  // Bottom info tag
  t('19 JULI  ·  14:00 – 19:00', CY + 200, 22, wa(0.20), MONO);
}

function renderP1(elapsed) {
  const rel = elapsed - P[1].s;
  ACTS.forEach(item => {
    const vis = rel >= item.t;
    ctx.globalAlpha = vis ? 1 : 0;
    if (item.sep) {
      t('— — —', item.y, item.size, ma(0.80), MONO);
    } else if (item.hl) {
      glow(MINT, 55); t(item.name, item.y, item.size, MINT); noGlow();
    } else {
      t(item.name, item.y, item.size, '#fff');
    }
    ctx.globalAlpha = 1;
  });
}

function renderP2() {
  glow(MINT, 130);
  t('19 JULI', CY - 115, 380, MINT);
  noGlow();
  t('14:00 — 19:00', CY + 95, 62, wa(0.88), MONO);
  t('AMSTERDAM', CY + 210, 24, wa(0.26), MONO);
}

function renderP3() {
  t('TICKETS', CY - 80,  208, '#fff');
  glow(MINT, 80);
  t('IN BIO',  CY + 130, 208, MINT);
  noGlow();
  t('BARON COLLECTIVE · 19 JULI · AMSTERDAM', CY + 240, 20, wa(0.24), MONO);
}

// ─────────────────────────────────────────────
//  GRAIN + SCANLINES + VIGNETTE
// ─────────────────────────────────────────────
function overlays() {
  grain();
  // Scanlines
  ctx.save(); ctx.globalAlpha = 0.08; ctx.fillStyle = '#000';
  for (let y = 0; y < CH; y += 4) ctx.fillRect(0, y+2, CW, 2);
  ctx.restore();
  // Vignette
  const vg = ctx.createRadialGradient(CX,CY,0, CX,CY, Math.max(CW,CH)*0.62);
  vg.addColorStop(0,    'transparent');
  vg.addColorStop(0.42, 'transparent');
  vg.addColorStop(0.78, 'rgba(0,0,0,0.50)');
  vg.addColorStop(1.00, 'rgba(0,0,0,0.88)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, CW, CH);
}

// ─────────────────────────────────────────────
//  FLASH
// ─────────────────────────────────────────────
let flashAlpha = 0, flashCol = '#fff', flashDecay = 60;
function doFlash(col, alpha, decay) { flashAlpha = alpha; flashCol = col; flashDecay = decay; }
function drawFlash(dt) {
  if (flashAlpha <= 0) return;
  ctx.save(); ctx.globalAlpha = flashAlpha;
  ctx.fillStyle = flashCol; ctx.fillRect(0, 0, CW, CH);
  ctx.restore();
  flashAlpha = Math.max(0, flashAlpha - dt / flashDecay);
}

// ─────────────────────────────────────────────
//  GLITCH TIMER
// ─────────────────────────────────────────────
let lastGlitch = 0;
function maybeGlitch(ms) {
  if (ms - lastGlitch > 400 + Math.random() * 900) {
    isGlitch = true; lastGlitch = ms;
    setTimeout(() => { isGlitch = false; }, 60 + Math.random() * 80);
  }
}

// ─────────────────────────────────────────────
//  MAIN LOOP
// ─────────────────────────────────────────────
const PHASES_LEN = P.length;
let t0 = null, prevNow = null, rafId = null, activePhase = -1;

function frame(now) {
  const dt = prevNow ? now - prevNow : 16; prevNow = now;
  if (!t0) t0 = now;
  const ms = now - t0;

  document.getElementById('pbar').style.width = Math.min(ms/TOTAL*100, 100) + '%';

  // Single-pass phase detection
  let phase = PHASES_LEN - 1;
  for (let i = 0; i < P.length; i++) {
    if (ms < P[i].e) { phase = i; break; }
  }

  // Hard-cut flash on phase change
  if (phase !== activePhase) {
    if (activePhase >= 0) doFlash('#fff', 0.78, 52);
    activePhase = phase;
  }

  // Render background
  bg(ms, phase);

  // Phase content
  if (phase === 0) { maybeGlitch(ms); renderP0(); if (Math.random()<0.006) doFlash('#fff',0.18,28); }
  else if (phase === 1) { renderP1(ms); if (Math.random()<0.005) doFlash('#fff',0.28,30); }
  else if (phase === 2) { renderP2(); if (Math.random()<0.013) doFlash(MINT,0.13,26); if (Math.random()<0.007) doFlash('#fff',0.42,38); }
  else if (phase === 3) { renderP3(); }

  overlays();
  drawFlash(dt);

  if (ms < TOTAL) {
    rafId = requestAnimationFrame(frame);
  } else {
    setStatus('Klaar · klik opnieuw om te herspelen');
    document.getElementById('play-btn').textContent = '↺  Replay';
    document.getElementById('play-btn').disabled = false;
    document.getElementById('rec-btn').disabled  = false;
  }
}

// ─────────────────────────────────────────────
//  CONTROLS
// ─────────────────────────────────────────────
function reset() {
  if (rafId) cancelAnimationFrame(rafId);
  t0 = null; prevNow = null; activePhase = -1;
  lastGlitch = 0; isGlitch = false; flashAlpha = 0;
  document.getElementById('pbar').style.width = '0%';
}

function startPromo() {
  reset();
  document.getElementById('play-btn').textContent = '▶  Play';
  document.getElementById('play-btn').disabled = true;
  document.getElementById('rec-btn').disabled  = false;
  setStatus('');
  rafId = requestAnimationFrame(frame);
  setTimeout(() => { document.getElementById('play-btn').disabled = false; }, TOTAL + 300);
}

let recorder = null, recChunks = [];

function startRecord() {
  if (recorder && recorder.state === 'recording') return;
  reset();
  recChunks = [];

  const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
    ? 'video/webm;codecs=vp9' : 'video/webm';
  const stream = canvas.captureStream(30);
  recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 10_000_000 });

  recorder.ondataavailable = e => { if (e.data.size > 0) recChunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(recChunks, { type: mime });
    const url  = URL.createObjectURL(blob);
    const a    = Object.assign(document.createElement('a'), { href: url, download: 'baron-collective-19juli.webm' });
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    document.getElementById('rec-btn').textContent = '⏺  Download video';
    document.getElementById('rec-btn').classList.remove('recording');
    document.getElementById('rec-btn').disabled = false;
    setStatus('Gedownload (.webm) · converteer naar MP4 voor Instagram via cloudconvert.com');
  };

  recorder.start(100);
  rafId = requestAnimationFrame(frame);

  document.getElementById('rec-btn').textContent = '⏺  Opnemen…';
  document.getElementById('rec-btn').classList.add('recording');
  document.getElementById('rec-btn').disabled = true;
  document.getElementById('play-btn').disabled = true;
  setStatus('Opname bezig… 15 seconden');

  setTimeout(() => { if (recorder.state === 'recording') recorder.stop(); }, TOTAL + 400);
  setTimeout(() => { document.getElementById('play-btn').disabled = false; }, TOTAL + 500);
}

function setStatus(msg) { document.getElementById('status').textContent = msg; }

// Initial black frame
ctx.fillStyle = '#000'; ctx.fillRect(0, 0, CW, CH);
</script>
</body>
</html>
